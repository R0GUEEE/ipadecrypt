name: Portable checks
on:
  push:
    branches: [feature/portable-backends]
  pull_request:
jobs:
  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable packages
        run: go test ./internal/backend/... ./internal/inspection/... ./cmd/ipadecrypt
      - name: Build CLI natively
        run: go build -o ipadecrypt-test ./cmd/ipadecrypt
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross compile CLI
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            echo "Building $GOOS/$GOARCH"
            go build -o "$RUNNER_TEMP/ipadecrypt-$GOOS-$GOARCH" ./cmd/ipadecrypt
          done

  simulator-capability:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode and simulator runtimes
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list runtimes
      - name: Confirm offline inspector builds on macOS
        run: go test ./internal/inspection ./internal/backend/...

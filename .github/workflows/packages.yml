name: Packages

# Builds the on-device artefacts from source, without a device:
#   - ipadecrypt-helper-arm64  (the CLI embeds it; the app ships it too)
#   - the rootless .deb packages (app + auto-confirm tweak)
#
# The helper is built inside the pinned Docker toolchain so its bytes match
# ci.yml's drift check. The .debs are built on macOS with Theos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'helper/**'
      - 'cmd/**'
      - 'internal/**'
      - 'Tools/build-packages.sh'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags="-s -w" -o "ipadecrypt-${GOOS}-${GOARCH}${ext}" ./cmd/ipadecrypt
          ls -l "ipadecrypt-${GOOS}-${GOARCH}${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: ipadecrypt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ipadecrypt-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  helper:
    name: build ipadecrypt-helper
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: reuse or build the pinned toolchain image
        run: |
          set -euo pipefail
          hash=$(sha256sum helper/Dockerfile | cut -c1-12)
          # GHCR requires a lowercase repository name; GitHub logins may not be.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/${owner}/ipadecrypt-toolchain:df-${hash}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "reusing $img"
          else
            echo "building $img (first run on this repository)"
            docker buildx build \
              --platform linux/amd64 --load \
              --provenance=false --sbom=false \
              -t "$img" helper/
          fi
          echo "IPADECRYPT_TOOLCHAIN_IMAGE=$img" >> "$GITHUB_ENV"

      - name: build helper
        run: ./helper/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ipadecrypt-helper-arm64
          path: helper/dist/ipadecrypt-helper-arm64
          if-no-files-found: error

  packages:
    name: build .debs
    needs: helper
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: ipadecrypt-helper-arm64
          path: helper/dist

      - name: install tooling
        run: |
          set -euo pipefail
          brew install ldid dpkg
          ldid -v | head -n 1 || true
          dpkg-deb --version | head -n 1

      - name: install Theos
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          url=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest \
                | jq -r '.assets[] | select(.name == "iPhoneOS16.5.sdk.tar.xz") | .browser_download_url')
          [ -n "$url" ]
          curl -fsSL -o /tmp/iPhoneOS.sdk.tar.xz "$url"
          tar -xJf /tmp/iPhoneOS.sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: build packages
        run: |
          set -euo pipefail
          sh Tools/build-packages.sh \
            --helper helper/dist/ipadecrypt-helper-arm64 \
            --refresh-embedded \
            --rootless-only

      # Records the arch / platform / minOS of every binary that ships, so a
      # regression that silently raises the minimum iOS is visible in the log.
      - name: verify package binaries
        run: |
          set -euo pipefail
          deb=$(ls dist/com.korboy.ipadecrypt_*_iphoneos-arm64.deb)
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          dpkg-deb -x "$deb" /tmp/verify
          python3 Tools/macho_info.py \
            /tmp/verify/var/jb/Applications/ipadecrypt.app/ipadecrypt \
            /tmp/verify/var/jb/Applications/ipadecrypt.app/helper.arm64 \
            /tmp/verify/var/jb/Applications/ipadecrypt.app/appstore-helper.arm64 \
            /tmp/verify/var/jb/usr/libexec/ipadecryptd | tee /tmp/verify/binary-report.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/verify/binary-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ipadecrypt-packages
          path: dist/*.deb
          if-no-files-found: error

      # These are the copies a release should carry (the CLI embeds them);
      # uploading them makes the run's exact bytes retrievable.
      - uses: actions/upload-artifact@v4
        with:
          name: ipadecrypt-embedded
          path: |
            internal/device/ipadecryptautoalert.deb
            internal/device/ipadecrypt-helper-arm64
          if-no-files-found: error

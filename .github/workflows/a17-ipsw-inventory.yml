name: A17 IPSW firmware inventory
on:
  workflow_dispatch:
  push:
    branches: [feature/portable-backends]
    paths:
      - '.github/workflows/a17-ipsw-inventory.yml'
      - 'scripts/compare_ipsw_inventory.py'
jobs:
  inspect-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/powershell || true
          df -h .
      - name: Download and inventory Apple IPSWs sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware results
          inventory() {
            local build="$1" url="$2" expected="$3"
            local file="firmware/iPhone16,2_27.2_${build}_Restore.ipsw"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --continue-at - --output "$file" "$url"
            printf '%s  %s\n' "$expected" "$file" | sha256sum --check -
            python3 - "$file" "$build" "results/${build}.json" <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from compare_ipsw_inventory import inventory
          with open(sys.argv[3], 'w') as f:
              json.dump(inventory(sys.argv[1], sys.argv[2]), f, indent=2)
          PY
            rm -f "$file"
            df -h .
          }
          inventory 24B5099f 'https://updates.cdn-apple.com/2026FallSeed/f8e317a0-cc63-4333-940f-e7418a409e59/iPhone16,2_27.2_24B5099f_Restore.ipsw' '9e20553ff1fb9eadc59eec6c5fdb9de0bd63f10a55a1e6707fe4579c789827e4'
          inventory 24B5110a 'https://updates.cdn-apple.com/2026FallSeed/60788e91-0d08-498b-961b-ea6a8d03b334/iPhone16,2_27.2_24B5110a_Restore.ipsw' '01c7eb92ce296bffb813fec8fa6750ac6409710f51a7566f9424a6ca0f176fea'
          python3 scripts/compare_ipsw_inventory.py results/24B5099f.json results/24B5110a.json --output results/firmware-zip-diff.json
      - name: Publish comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone16-2-ios27-beta3-beta4-inventory
          path: results/
          if-no-files-found: warn
          retention-days: 14
